name: Backup

on:
  schedule:
    # Nightly 00:30 UTC — see docs/data-lifecycle.md "Backups".
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  mongo:
    name: Encrypted Mongo snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mongodump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq mongodb-database-tools

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ runner.temp }}/kulaya-backups
        run: bash apps/api/scripts/backup.sh

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: kulaya-mongo-${{ github.run_id }}
          path: ${{ runner.temp }}/kulaya-backups/daily/*.enc
          retention-days: 14
          if-no-files-found: error
