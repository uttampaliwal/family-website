<!doctype html>
<html lang="en" data-theme="warm" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kulaya — the family nest. A private home for our family's photos, events, documents, and moments." />
    <meta name="theme-color" content="#b4532a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kulaya" />
    <meta property="og:title" content="Kulaya — The Family Nest" />
    <meta property="og:description" content="A private home for our family's photos, events, documents, and moments — built for every generation." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kulaya · The Family Nest</title>
    <link rel="icon" type="image/svg+xml" href="/family-icon.svg" />
    <link rel="canonical" href="https://kulaya.family/" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("family-portal.theme");
          var t = "warm", m = "light";
          if (stored) {
            var p = JSON.parse(stored);
            if (p.theme) t = p.theme;
            if (p.mode) m = p.mode;
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-mode", m);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Baloo+2:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
