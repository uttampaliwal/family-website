<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Family Icon -->
  <g transform="translate(20, 20)">
    <!-- House -->
    <path d="M10 25 L25 15 L40 25 V35 H10 Z" fill="url(#iconGradient)" stroke="#92400e" stroke-width="1.5"/>
    <!-- Roof -->
    <polygon points="7,25 25,10 43,25" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
    <!-- Door -->
    <rect x="20" y="28" width="10" height="7" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <!-- Windows -->
    <rect x="12" y="28" width="5" height="4" fill="#60a5fa" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="33" y="28" width="5" height="4" fill="#60a5fa" stroke="#3b82f6" stroke-width="0.5"/>
    <!-- Chimney -->
    <rect x="30" y="12" width="3" height="8" fill="#7f1d1d"/>
  </g>

  <!-- Text -->
  <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#textGradient)" filter="url(#shadow)">Family Portal</text>
  <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Connecting Generations</text>
</svg>
  

</svg>