<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="familyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <style>
    .family-tree {
      filter: url(#glow);
      animation: gentle-sway 6s ease-in-out infinite alternate;
    }
    @keyframes gentle-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
  </style>
  
  <!-- Family Tree Logo -->
  <g class="family-tree" transform="translate(50, 50)">
    <!-- Tree trunk -->
    <rect x="45" y="60" width="10" height="25" fill="url(#familyGradient)" rx="2"/>

    <!-- Tree crown -->
    <path d="M35 60 Q50 40 65 60 Q50 35 35 60 Z" fill="#228B22"/>
    <path d="M38 55 Q50 38 62 55 Q50 32 38 55 Z" fill="#32CD32"/>
    <path d="M42 50 Q50 35 58 50 Q50 28 42 50 Z" fill="#90EE90"/>

    <!-- Family figures -->
    <!-- Parent 1 -->
    <circle cx="45" cy="25" r="3" fill="#FFD700"/>
    <!-- Parent 2 -->
    <circle cx="55" cy="25" r="3" fill="#FFD700"/>
    <!-- Child 1 -->
    <circle cx="40" cy="35" r="2.5" fill="#FF69B4"/>
    <!-- Child 2 -->
    <circle cx="50" cy="35" r="2.5" fill="#FF69B4"/>
    <!-- Child 3 -->
    <circle cx="60" cy="35" r="2.5" fill="#FF69B4"/>

    <!-- Connecting lines -->
    <line x1="48" y1="28" x2="45" y2="32" stroke="#8B4513" stroke-width="1"/>
    <line x1="52" y1="28" x2="55" y2="32" stroke="#8B4513" stroke-width="1"/>
    <line x1="47" y1="32" x2="42.5" y2="37.5" stroke="#8B4513" stroke-width="1"/>
    <line x1="47" y1="32" x2="47.5" y2="37.5" stroke="#8B4513" stroke-width="1"/>
    <line x1="53" y1="32" x2="57.5" y2="37.5" stroke="#8B4513" stroke-width="1"/>
  </g>

  <!-- Text -->
  <text x="50" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B4513">Family Portal</text>
  

</svg>