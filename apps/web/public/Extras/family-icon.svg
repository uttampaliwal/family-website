<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <title>Project Turnix Icon</title>
  <desc>A premium, dynamic icon for Project Turnix that adapts to light and dark modes</desc>
  <?xml-stylesheet type="text/css" href="../svg-styles.css"?>
  <defs>
    <!-- Gradients for light mode -->
    <linearGradient id="butterflyGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff8b94" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <style>
    /* Light mode (default) */
    :root {
      --bg-color: #0D1B2A;
      --butterfly-fill: url(#butterflyGradientLight);
      --text-color: #ffffff;
      --stroke-color: #ffffff;
    }
    
    /* Dark mode overrides */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0D1B2A;
        --butterfly-fill: #FFD700;
        --text-color: #ffffff;
        --stroke-color: #ffffff;
      }
    }
    
    /* Animations */
    .butterfly {
      transform-origin: center;
      animation: flutter 3s ease-in-out infinite alternate;
    }
    
    @keyframes flutter {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .butterfly:hover {
      filter: url(#glow);
    }
    
    text {
      font-family: 'Poppins', 'Montserrat', system-ui, sans-serif;
    }
  </style>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="var(--bg-color)" />

  <!-- Butterfly shape with animation -->
  <path class="butterfly" d="M32 28 
           C24 16, 14 16, 18 28
           C14 40, 24 40, 32 28
           C40 40, 50 40, 46 28
           C50 16, 40 16, 32 28Z"
        fill="var(--butterfly-fill)" stroke="var(--stroke-color)" stroke-width="1.5">
    <animate attributeName="d" 
             values="M32 28 C24 16, 14 16, 18 28 C14 40, 24 40, 32 28 C40 40, 50 40, 46 28 C50 16, 40 16, 32 28Z;
                     M32 28 C24 15, 13 15, 17 28 C13 41, 24 41, 32 28 C40 41, 51 41, 47 28 C51 15, 40 15, 32 28Z;
                     M32 28 C24 16, 14 16, 18 28 C14 40, 24 40, 32 28 C40 40, 50 40, 46 28 C50 16, 40 16, 32 28Z" 
             dur="3s" 
             repeatCount="indefinite" />
  </path>

  <!-- Letter T for Turnix -->
  <text x="32" y="50" text-anchor="middle"
        font-family="Poppins"
        font-size="18" 
        font-weight="bold"
        fill="var(--text-color)">
    T
  </text>
</svg>
