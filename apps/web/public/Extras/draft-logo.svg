<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background gradient -->
  <defs>
    <!--radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter -->
  </defs>

  <!-- Background -->
  <!-- rect width="100%" height="100%" fill="url(#bgGradient)"/ -->

  <!-- Tree (centered, behind text) -->
  <g transform="translate(400,400) scale(1.0)" filter="url(#dropShadow)">
    <!-- Tree trunk -->
    <rect x="-8" y="0" width="16" height="60" fill="url(#trunkGradient)" rx="2"/>
    
    <!-- Tree crown - multiple organic shapes -->
    <ellipse cx="0" cy="-10" rx="45" ry="35" fill="url(#leafGradient)" opacity="0.9"/>
    <ellipse cx="-20" cy="-25" rx="30" ry="25" fill="url(#leafGradient)" opacity="0.8"/>
    <ellipse cx="25" cy="-20" rx="35" ry="30" fill="url(#leafGradient)" opacity="0.8"/>
    <ellipse cx="0" cy="-40" rx="25" ry="20" fill="url(#leafGradient)" opacity="0.9"/>
    
    <!-- Tree branches -->
    <path d="M-5,-5 Q-15,-15 -25,-10" stroke="#654321" stroke-width="3" fill="none"/>
    <path d="M5,-8 Q20,-18 30,-12" stroke="#654321" stroke-width="3" fill="none"/>
    <path d="M0,-20 Q-10,-35 -5,-40" stroke="#654321" stroke-width="2" fill="none"/>
    <path d="M0,-22 Q12,-38 8,-42" stroke="#654321" stroke-width="2" fill="none"/>
  </g>

  <!-- Enhanced flower (positioned elegantly) -->
  <g transform="translate(320,380) scale(0.8)" filter="url(#dropShadow)">
    <!-- Flower stem -->
    <path d="M0,40 Q5,20 0,0 Q-2,-10 2,-15" stroke="#4a7c59" stroke-width="3" fill="none"/>
    
    <!-- Flower petals -->
    <g transform="translate(0,-15)">
      <!-- Petal 1 -->
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#e4c998" opacity="0.9" transform="rotate(0)"/>
      <!-- Petal 2 -->
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#e4c998" opacity="0.9" transform="rotate(72)"/>
      <!-- Petal 3 -->
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#e4c998" opacity="0.9" transform="rotate(144)"/>
      <!-- Petal 4 -->
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#e4c998" opacity="0.9" transform="rotate(216)"/>
      <!-- Petal 5 -->
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#e4c998" opacity="0.9" transform="rotate(288)"/>
      
      <!-- Flower center -->
      <circle cx="0" cy="0" r="5" fill="#e09380"/>
      <circle cx="0" cy="0" r="2" fill="#c26835"/>
    </g>
    
    <!-- Small leaves -->
    <ellipse cx="-8" cy="15" rx="4" ry="8" fill="url(#leafGradient)" transform="rotate(-30 -8 15)"/>
    <ellipse cx="10" cy="25" rx="3" ry="6" fill="url(#leafGradient)" transform="rotate(45 10 25)"/>
  </g>

  <!-- Butterfly (right top, animated) -->
  <g transform="translate(300,220) scale(1)" filter="url(#dropShadow)">
    <!-- Butterfly body -->
    <ellipse cx="0" cy="0" rx="2" ry="25" fill="#654321"/>
    <circle cx="0" cy="-20" r="3" fill="#2d2d2d"/>
    
    <!-- Antennae -->
    <path d="M-2,-22 Q-8,-30 -6,-32" stroke="#2d2d2d" stroke-width="1" fill="none"/>
    <path d="M2,-22 Q8,-30 6,-32" stroke="#2d2d2d" stroke-width="1" fill="none"/>
    <circle cx="-6" cy="-32" r="1" fill="#2d2d2d"/>
    <circle cx="6" cy="-32" r="1" fill="#2d2d2d"/>
    
    <!-- Left wings -->
    <ellipse cx="-15" cy="-8" rx="18" ry="12" fill="#ff6b6b" opacity="0.8" transform="rotate(-20 -15 -8)"/>
    <ellipse cx="-12" cy="8" rx="12" ry="8" fill="#4ecdc4" opacity="0.8" transform="rotate(-10 -12 8)"/>
    
    <!-- Right wings -->
    <ellipse cx="15" cy="-8" rx="18" ry="12" fill="#ff6b6b" opacity="0.8" transform="rotate(20 15 -8)"/>
    <ellipse cx="12" cy="8" rx="12" ry="8" fill="#4ecdc4" opacity="0.8" transform="rotate(10 12 8)"/>
    
    <!-- Wing patterns -->
    <circle cx="-15" cy="-8" r="4" fill="#ffe66d" opacity="0.7"/>
    <circle cx="15" cy="-8" r="4" fill="#ffe66d" opacity="0.7"/>
    <circle cx="-12" cy="8" r="2" fill="#ff8b94" opacity="0.7"/>
    <circle cx="12" cy="8" r="2" fill="#ff8b94" opacity="0.7"/>
    
    <!-- Animation -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="320,230; 330,240; 320,250" 
      dur="3s" 
      repeatCount="indefinite"/>
  </g>

  <!-- Additional decorative elements -->
  <!-- Small scattered leaves -->
  <g opacity="0.6">
    <ellipse cx="150" cy="200" rx="3" ry="6" fill="url(#leafGradient)" transform="rotate(45 150 200)"/>
    <ellipse cx="680" cy="280" rx="2" ry="4" fill="url(#leafGradient)" transform="rotate(-30 680 280)"/>
    <ellipse cx="120" cy="420" rx="4" ry="7" fill="url(#leafGradient)" transform="rotate(60 120 420)"/>
    <ellipse cx="700" cy="450" rx="3" ry="5" fill="url(#leafGradient)" transform="rotate(-45 700 450)"/>
  </g>

  <!-- Project Title with enhanced styling -->
  <text x="400" y="450" font-family="'Montserrat', sans-serif"
        font-size="48" font-weight="300" text-anchor="middle" fill="#2E3A59" filter="url(#dropShadow)">
    PROJECT
  </text>
  
  <text x="400" y="520" font-family="'Poppins', sans-serif"
        font-size="72" font-weight="700" text-anchor="middle" fill="#2E3A59" 
        letter-spacing="2px" filter="url(#dropShadow)">
    TURN IX
  </text>

  <!-- Tagline with decorative elements -->
  <g>
    <line x1="250" y1="555" x2="350" y2="555" stroke="#888" stroke-width="1" opacity="0.6"/>
    <line x1="450" y1="555" x2="550" y2="555" stroke="#888" stroke-width="1" opacity="0.6"/>
    
    <text x="400" y="560" font-family="'Montserrat', sans-serif"
          font-size="22" font-weight="300" text-anchor="middle" fill="#666" 
          font-style="italic">
      Connecting branches
    </text>
  </g>

  <!-- Subtle corner ornaments -->
  <g opacity="0.3">
    <!-- Top left ornament -->
    <path d="M30,30 Q50,20 70,30 Q50,40 30,30" fill="url(#leafGradient)"/>
    
    <!-- Bottom right ornament -->
    <path d="M730,570 Q750,560 770,570 Q750,580 730,570" fill="url(#leafGradient)"/>
  </g>
</svg>