<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Test Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .light-mode {
      background-color: #f8f9fa;
      color: #212529;
    }
    
    .dark-mode {
      background-color: #212529;
      color: #f8f9fa;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    
    button {
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background-color: #4361ee;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    
    button:hover {
      background-color: #3a56d4;
    }
    
    .svg-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 50px;
    }
    
    .svg-item {
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.3s ease;
    }
    
    .dark-mode .svg-item {
      border-color: #495057;
    }
    
    .svg-item h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }
    
    .svg-item img {
      max-width: 100%;
      height: auto;
    }
    
    .svg-item object {
      width: 100%;
      height: 300px;
    }
    
    .nav-test {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      transition: background-color 0.3s ease;
    }
    
    .dark-mode .nav-test {
      background-color: #343a40;
    }
    
    .nav-test img {
      height: 50px;
      margin-right: 15px;
    }
    
    .nav-test span {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body class="light-mode">
  <div class="container">
    <h1>SVG Test Page</h1>
    
    <div class="controls">
      <button id="light-mode-btn">Light Mode</button>
      <button id="dark-mode-btn">Dark Mode</button>
    </div>
    
    <h2>Navigation Bar Test</h2>
    <div class="nav-test">
      <img src="family-logo.svg" alt="Family Logo">
      <span>Family Website</span>
    </div>
    
    <h2>SVG Files Test</h2>
    <div class="svg-container">
      <div class="svg-item">
        <h3>family-logo.svg</h3>
        <object type="image/svg+xml" data="family-logo.svg"></object>
      </div>
      
      <div class="svg-item">
        <h3>logo.svg</h3>
        <object type="image/svg+xml" data="logo.svg"></object>
      </div>
      
      <div class="svg-item">
        <h3>draft-logo.svg (Extras)</h3>
        <object type="image/svg+xml" data="Extras/draft-logo.svg"></object>
      </div>
      
      <div class="svg-item">
        <h3>family-icon.svg (Extras)</h3>
        <object type="image/svg+xml" data="Extras/family-icon.svg"></object>
      </div>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const lightModeBtn = document.getElementById('light-mode-btn');
      const darkModeBtn = document.getElementById('dark-mode-btn');
      const body = document.body;
      
      lightModeBtn.addEventListener('click', function() {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
        updateSVGThemes('light');
      });
      
      darkModeBtn.addEventListener('click', function() {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        updateSVGThemes('dark');
      });
      
      function updateSVGThemes(mode) {
        const objects = document.querySelectorAll('object');
        objects.forEach(obj => {
          obj.addEventListener('load', function() {
            const svgDoc = obj.contentDocument;
            if (svgDoc) {
              const svgRoot = svgDoc.documentElement;
              if (mode === 'dark') {
                svgRoot.classList.add('dark-mode');
              } else {
                svgRoot.classList.remove('dark-mode');
              }
            }
          });
          // Reload to trigger the load event
          const currentSrc = obj.getAttribute('data');
          obj.setAttribute('data', '');
          setTimeout(() => obj.setAttribute('data', currentSrc), 10);
        });
      }
    });
  </script>
</body>
</html>
