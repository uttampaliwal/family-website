services:
  mongo:
    image: mongo:7.0
    container_name: family-website-mongo
    volumes:
      - mongo-data:/data/db
    command: mongod --bind_ip 0.0.0.0
    ports:
      - "27017:27017"
    restart: unless-stopped
    networks:
      - family-portal-network
    healthcheck:
      # This simpler form passes credentials as separate arguments, which is more robust and less
      # prone to errors from special characters in passwords than using a full URI string.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s   # Check every 10 seconds
      timeout: 10s    # The check must complete within 10 seconds
      retries: 3      # Retry 3 times before failing
      start_period: 30s # A more reasonable 30-second grace period
    env_file:
      - ./.env
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - TURBO_TELEMETRY_DISABLED=${TURBO_TELEMETRY_DISABLED:-1}
    container_name: family-portal-api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health-check"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - MONGO_HOST=mongo
    env_file:
      - ./.env
      - ./apps/api/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - family-portal-network
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - TURBO_TELEMETRY_DISABLED=${TURBO_TELEMETRY_DISABLED:-1}
    container_name: family-website-web
    ports:
      - "80:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - family-portal-network

volumes:
  mongo-data:

networks:
  family-website-network:
    driver: bridge