services:
  mongo:
    image: mongo:7.0
    container_name: family-website-mongo
    volumes:
      - mongo-data:/data/db
    command: mongod --bind_ip 0.0.0.0
    restart: unless-stopped
    networks:
      - family-website-network
    healthcheck:
      # This simpler form passes credentials as separate arguments, which is more robust and less
      # prone to errors from special characters in passwords than using a full URI string.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s   # Check every 10 seconds
      timeout: 10s    # The check must complete within 10 seconds
      retries: 3      # Retry 3 times before failing
      start_period: 30s # A more reasonable 30-second grace period
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-family_website}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    env_file:
      - ./.env
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: family-website-api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health-check"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - ./.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - family-website-network
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: family-website-web
    ports:
      - "80:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - family-website-network

volumes:
  mongo-data:

networks:
  family-website-network:
    driver: bridge