<!DOCTYPE html>
<html>
<head>
    <title>Registration Test</title>
    <script>
        async function register() {
            try {
                // First get CSRF token
                const csrfResponse = await fetch('http://localhost:3000/api/auth/csrf-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                // Get the CSRF token from cookies
                const csrfToken = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('XSRF-TOKEN='))
                    ?.split('=')[1];
                
                if (!csrfToken) {
                    document.getElementById('result').innerText = 'No CSRF token found';
                    return;
                }
                
                document.getElementById('result').innerText = 'CSRF Token: ' + decodeURIComponent(csrfToken);
                
                // Now register
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-XSRF-TOKEN': decodeURIComponent(csrfToken)
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        name: 'Test User',
                        email: 'test@example.com',
                        password: 'TestPassword123!',
                        dob: '1990-01-01',
                        mobileNumber: '1234567890',
                        username: 'testuser',
                        gender: 'Male'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerText += '\n\nResponse: ' + JSON.stringify(data);
            } catch (error) {
                document.getElementById('result').innerText = 'Error: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <h1>Registration Test</h1>
    <button onclick="register()">Register</button>
    <pre id="result"></pre>
</body>
</html>
